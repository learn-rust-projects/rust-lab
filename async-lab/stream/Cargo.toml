[package]
name = "stream"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
futures = "0.3.32"
tokio-stream = { version = "0.1.18", features = [
    "sync",
    "net",
    "time",
    "fs",
    "signal",
    "io-util",
] }

