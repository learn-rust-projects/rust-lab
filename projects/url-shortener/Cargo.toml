[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum = { version = "0.8.9", features = ["http2", "query", "tracing"] }
anyhow = "1.0.102"
tokio = { version = "1.52.1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
    "mysql",
    "runtime-tokio",
    "tls-rustls",
] }
nanoid = "0.5.0"
