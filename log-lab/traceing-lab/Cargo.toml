[package]
name = "traceing-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2"
tracing-log = "0.2"
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7.5", features = ["http2", "query", "tracing"] }
anyhow = "1.0.102"
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"] }
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0" ,features = ["trace","experimental_trace_batch_span_processor_with_async_runtime", "rt-tokio"] }
tracing-opentelemetry = "0.32.1"

[dev-dependencies]
tracing-test = "0.2"
